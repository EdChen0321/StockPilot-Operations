<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">StockPilot 營運系統專案介紹</title>
  <desc id="desc">深藍綠色營運分析圖。左側呈現銷售趨勢、訂單來源與 KOL 歸屬；右側說明訂單及銷售核對。</desc>
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#33515a" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="#102b33"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity=".28"/>
  <rect width="14" height="630" fill="#8bded5"/>

  <rect x="60" y="112" width="418" height="396" rx="20" fill="#1e4248" stroke="#648b88" stroke-width="2"/>
