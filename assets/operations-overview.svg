  <path d="M90 187H448" stroke="#648b88" stroke-width="2"/>
  <text x="90" y="220" fill="#9dd8d1" font-family="Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="18">依期間核對銷售趨勢</text>
  <path d="M91 268H446M91 324H446M91 380H446" stroke="#4d7072" stroke-width="2"/>
  <rect x="112" y="316" width="39" height="64" rx="5" fill="#4d9794"/>
  <rect x="174" y="282" width="39" height="98" rx="5" fill="#72c5bd"/>
  <rect x="236" y="302" width="39" height="78" rx="5" fill="#4d9794"/>
  <rect x="298" y="249" width="39" height="131" rx="5" fill="#8bded5"/>
  <rect x="360" y="269" width="39" height="111" rx="5" fill="#72c5bd"/>
  <path d="M91 380H446" stroke="#a5cfc6" stroke-width="2"/>
  <path d="M90 404H448" stroke="#648b88" stroke-width="2"/>
  <text x="91" y="443" fill="#8bded5" font-family="Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="21" font-weight="700">訂單來源</text>
  <text x="91" y="477" fill="#f6f4e9" font-family="Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="20">逐筆核對</text>
  <path d="M264 422V480" stroke="#648b88" stroke-width="2"/>
  <text x="286" y="443" fill="#8bded5" font-family="Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="21" font-weight="700">KOL 歸屬</text>
  <text x="286" y="477" fill="#f6f4e9" font-family="Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="20">依 UTM 比對</text>

  <text x="529" y="80" fill="#9dd8d1" font-family="Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="3">STOCKPILOT / OPERATIONS</text>
  <path d="M529 105H1134M529 472H1134" stroke="#528080" stroke-width="2"/>
  <text x="525" y="220" fill="#f6f4e9" font-family="Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="78" font-weight="800">賣了什麼？</text>
  <text x="525" y="325" fill="#8bded5" font-family="Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="78" font-weight="800">訂單從哪裡來？</text>
  <text x="530" y="394" fill="#d0e1df" font-family="Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="27">匯入訂單，核對銷售與 KOL 歸屬。</text>
  <text x="530" y="521" fill="#f6f4e9" font-family="Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="25" font-weight="600">接單 · 核對 · 分析 · 追查</text>
  <text x="530" y="566" fill="#9dd8d1" font-family="Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="23">從訂單來源到 KOL 歸屬，都有依據。</text>
  <text x="1154" y="594" text-anchor="end" fill="#80aba8" font-family="Arial, sans-serif" font-size="17" letter-spacing="2">OPEN SOURCE · 2026</text>
